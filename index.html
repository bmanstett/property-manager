<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; frame-src blob:; worker-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#183932" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="A private, offline workspace for your rental property, financial records, leases, and documents."
    />
    <title>Home · Property Manager</title>
    <link rel="icon" href="assets/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="money.css" />
    <link rel="stylesheet" href="lease.css" />
    <link rel="stylesheet" href="accessibility.css" />
    <script defer src="icons.js"></script>
    <script defer src="pdf-font.js"></script>
    <script defer src="export.js"></script>
    <script defer src="github-sync.js"></script>
    <script defer src="storage.js"></script>
    <script defer src="rules.js"></script>
    <script defer src="money.js"></script>
    <script defer src="lease-notices.js"></script>
    <script defer src="leases.js"></script>
    <script defer src="records.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip" href="#content">Skip to workspace</a>
    <aside class="sidebar" aria-label="Property workspace">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true"></span
        ><span>Property Manager<span class="brand-period">.</span></span>
      </div>
      <div class="nav-caption">Workspace</div>
      <nav class="side-nav" aria-label="Primary navigation"></nav>
      <div class="rail-bottom">
        <button id="rail-backup" class="backup-card"></button
        ><button class="rail-link" data-act="settings">
          <i data-icon="settings"></i>Settings</button
        ><button class="rail-link" data-act="help">
          <i data-icon="help"></i>Help &amp; installation
        </button>
        <div class="rail-foot">
          <i data-icon="shield"></i> Private workspace
        </div>
      </div>
    </aside>
    <div class="application">
      <header class="topbar">
        <button
          class="property-switch"
          data-act="properties"
          aria-label="Choose property"
        >
          <span class="property-icon"><i data-icon="building"></i></span
          ><span id="selected-property">Property Manager</span
          ><i data-icon="chevrons"></i>
        </button>
        <div class="top-tools">
          <button
            class="search-trigger"
            data-act="search"
            aria-label="Search workspace"
          >
            <i data-icon="search"></i><span>Search workspace</span
            ><kbd>/</kbd></button
          ><button
            class="icon-button notifications"
            data-act="attention"
            aria-label="View items needing attention"
          >
            <i data-icon="bell"></i><b id="notice-dot" hidden></b></button
          ><button
            class="avatar"
            data-act="settings"
            aria-label="Workspace settings"
          >
            <i data-icon="user"></i>
          </button>
        </div>
      </header>
      <main id="content" tabindex="-1" aria-label="Workspace">
        <div class="loading-panel">Opening your workspace…</div>
      </main>
    </div>
    <nav class="bottom-nav" aria-label="Mobile navigation"></nav>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-inner">
        <header class="dialog-header">
          <h2 id="dialog-title"></h2>
          <button
            class="icon-button"
            id="dialog-close"
            aria-label="Close dialog"
          >
            <i data-icon="x"></i>
          </button>
        </header>
        <div id="dialog-body"></div>
      </div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript
      >This application needs JavaScript to open its local database.</noscript
    >
  </body>
</html>
