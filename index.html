<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; frame-src blob:; worker-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#18382f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="A private place to track rent, expenses, leases and documents for your rental. Works offline."
    />
    <title>Home · Property Manager</title>
    <link rel="icon" href="assets/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="money.css" />
    <link rel="stylesheet" href="lease.css" />
    <link rel="stylesheet" href="lease-sign.css" />
    <link rel="stylesheet" href="records.css" />
    <link rel="stylesheet" href="backup.css" />
    <link rel="stylesheet" href="accessibility.css" />
    <script defer src="icons.js"></script>
    <script defer src="ui.js"></script>
    <script defer src="pdf-font.js"></script>
    <script defer src="export.js"></script>
    <script defer src="github-sync.js"></script>
    <script defer src="storage.js"></script>
    <script defer src="money.js"></script>
    <script defer src="lease-law.js"></script>
    <script defer src="lease-clauses.js"></script>
    <script defer src="lease-document.js"></script>
    <script defer src="lease-packets.js"></script>
    <script defer src="leases.js"></script>
    <script defer src="records.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <aside class="sidebar" aria-label="App menu">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true"></span
        ><span>Property Manager<span class="brand-period">.</span></span>
      </div>
      <nav class="side-nav" aria-label="Primary navigation"></nav>
      <div class="rail-bottom">
        <button id="rail-backup" class="backup-card"></button
        ><button class="rail-link" data-act="settings">
          <i data-icon="settings"></i>Settings</button
        ><button class="rail-link" data-act="help">
          <i data-icon="help"></i>Help
        </button>
        <div class="rail-foot">
          <i data-icon="shield"></i>
          <span>Private. Saved on this device only.</span>
        </div>
      </div>
    </aside>
    <div class="application">
      <header class="topbar">
        <button
          class="property-switch"
          data-act="properties"
          aria-label="Switch rental"
        >
          <span class="property-icon"><i data-icon="building"></i></span
          ><span id="selected-property">Property Manager</span
          ><span id="sample-tag" class="sample-tag" hidden>Sample</span
          ><i data-icon="chevrons"></i>
        </button>
        <div class="top-tools">
          <button class="search-trigger" data-act="search" aria-label="Search">
            <i data-icon="search"></i><span>Search</span
            ><kbd aria-hidden="true">/</kbd></button
          ><button
            class="icon-button notifications"
            data-act="attention"
            aria-label="Needs attention"
          >
            <i data-icon="bell"></i><b id="notice-dot" hidden></b></button
          ><button class="avatar" data-act="settings" aria-label="Settings">
            <i data-icon="settings"></i>
          </button>
        </div>
      </header>
      <div id="sample-banner" class="sample-banner" hidden></div>
      <main id="content" tabindex="-1" aria-label="Content">
        <div class="loading-panel">Opening your records…</div>
      </main>
    </div>
    <nav class="bottom-nav" aria-label="Mobile navigation"></nav>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-inner">
        <header class="dialog-header">
          <button
            class="icon-button"
            id="dialog-back"
            type="button"
            aria-label="Back"
            hidden
          >
            <i data-icon="back"></i>
          </button>
          <h2 id="dialog-title"></h2>
          <button
            class="icon-button"
            id="dialog-close"
            type="button"
            aria-label="Close"
          >
            <i data-icon="x"></i>
          </button>
        </header>
        <div id="dialog-body"></div>
      </div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>Turn on JavaScript to use Property Manager.</noscript>
  </body>
</html>
